name: VS-01 quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true

      - name: Install Android API 36
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36"
          "build-tools;36.0.0"

      - name: Resolve locked dependencies
        run: flutter pub get

      - name: Verify approved authority and slice boundary
        run: dart run tool/verify_authority.dart

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool

      - name: Static analysis
        run: flutter analyze

      - name: Verify generated source is clean
        run: |
          dart run build_runner build
          git diff --exit-code -- lib/core/database/app_database.g.dart

      - name: Dependency resolution report
        run: |
          flutter pub deps --style=compact
          flutter pub outdated --no-dev-dependencies

      - name: Unit, repository, migration, and widget tests
        run: flutter test

      - name: Build debug APK
        run: >-
          flutter build apk --debug
          --dart-define-from-file=tool/env/production.json.example

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
